<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Snake</title>
  </head>
  <body>
    <h1 class="text-center text-6xl p-6">Snake Vault</h1>

    <div class="flex flex-col mt-10">
      <h3 class="text-center text-4xl p-6">Choose a game!</h3>

      <div class="flex flex-1 gap-2 justify-center">
        <a
          href="games/old-school/main.html"
          class="card bg-base-100 w-75 shadow-sm">
          <figure>
            <img
              src="photos/old-school.png"
              alt="text" />
          </figure>
          <div class="card-body">
            <h2 class="card-title">Old School</h2>
          </div>
        </a>

        <a
          href="games/another-game/main.html"
          class="card bg-base-100 w-75 shadow-sm">
          <figure>
            <img
              src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
              alt="Shoes" />
          </figure>
          <div class="card-body">
            <h2 class="card-title">Another game</h2>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
