<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Snake</title>
  </head>
  <body>
    <h1 class="text-center text-6xl p-6">Snake Vault</h1>

    <div class="flex flex-col mt-10 gap-10">
      <h3 class="text-center text-4xl p-6">Choose a game!</h3>

      <div class="flex flex-1 gap-2 justify-center">
        <!-- Old School Card-->
        <a
          href="games/old-school/main.html"
          class="card bg-base-100 w-75 shadow-sm">
          <figure>
            <img
              src="images/old-school2.png"
              alt="img" />
          </figure>
          <div class="card-body">
            <h2 class="card-title">Old School</h2>
            <p>The classic version of snake</p>
            <p
              id="hg-1"
              class="text-center bg-red-400 rounded-sm font-bold p-1">
              Highscore: 0
            </p>
          </div>
        </a>

        <!-- Another Game Card-->
        <a
          href="games/another-game/main.html"
          class="card bg-base-100 w-75 shadow-sm">
          <figure>
            <img
              src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
              alt="Shoes" />
          </figure>
          <div class="card-body">
            <h2 class="card-title">Another game</h2>
          </div>
        </a>

        <script src="script.js"></script>
      </div>
    </div>
  </body>
</html>
